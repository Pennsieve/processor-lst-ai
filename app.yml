# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: LST-AI Lesion Segmentation
  description: >-
    Segments white-matter hyperintensities (MS-type lesions) from a paired T1w
    and FLAIR volume with LST-AI 2.0.0rc1 (Wiltgen, McGinnis et al. 2024,
    NeuroImage: Clinical 42:103611), a PyTorch ensemble of three 3D U-Nets with
    greedy registration and HD-BET skull stripping, on CPU. Takes the raw
    (not skull-stripped) T1w and FLAIR NIfTI volumes of each subject, matched by
    subject label, and writes a binary lesion mask and a lesion probability map
    in FLAIR space, optionally McDonald-region labels, plus per-subject and
    cohort lesion volume (mm3) and count tables. Subjects lacking either volume
    are skipped; with no FLAIR at all the step writes empty outputs and succeeds.
  type: processor
  tags: [neuroimaging, mri, nifti, lst-ai, lesions, wmh]
runtime:
  cpu: 4096
  memory: 16384
  computeTypes: [standard]
  timeoutSeconds: 7200
parameters:
  - name: SEGMENT_ONLY
    type: boolean
    description: >-
      Only segment lesions; skip the FastSurfer-based annotation of each lesion
      into McDonald regions (periventricular, juxtacortical, subcortical,
      infratentorial). Annotation runs a whole-brain FastSurfer segmentation and
      is much slower on CPU.
    defaultValue: true
  - name: FAST_MODE
    type: boolean
    description: >-
      Brain extraction with one HD-BET model instead of the five-model ensemble
      (lst --fast-mode). On a CPU task each HD-BET model takes about ten
      minutes, so the ensemble alone is close to an hour per subject; one model
      is adequate for lesion segmentation. Turn off for the full ensemble.
    defaultValue: true
  - name: PROBABILITY_MAP
    type: boolean
    description: Also keep the ensemble's lesion probability map (FLAIR space) as <sub>_desc-wmh_probseg.nii.gz.
    defaultValue: true
  - name: THRESHOLD
    type: number
    description: Probability threshold for binarising the ensemble lesion map (lst --threshold).
    defaultValue: 0.5
  - name: THREADS
    type: integer
    description: Threads for the greedy registrations (lst --threads) and torch (OMP_NUM_THREADS).
    defaultValue: 4
inputs:
  - name: t1w
    description: >-
      T1-weighted volumes, NOT skull-stripped (the <sub>_T1w.nii.gz files from
      the prep step). Matched to FLAIR volumes by subject label.
    mediaTypes: [application/x-nifti-gz, application/x-nifti]
    placement: subfolder
    required: true
  - name: flair
    description: FLAIR volumes, NOT skull-stripped (<sub>_FLAIR.nii.gz), one per subject.
    mediaTypes: [application/x-nifti-gz, application/x-nifti]
    placement: subfolder
    required: true
outputs:
  - name: lesions
    description: >-
      Per subject, in FLAIR space: <sub>_desc-wmh_mask.nii.gz (binary, uint8),
      <sub>_desc-wmh_probseg.nii.gz (ensemble probability, when
      PROBABILITY_MAP) and <sub>_desc-wmhregions_dseg.nii.gz (McDonald region
      labels 1-4, unless SEGMENT_ONLY); plus provenance.json.
    mediaTypes: [application/x-nifti-gz, application/json]
  - name: lesion-volumes
    description: >-
      <sub>_lesions.csv and the cohort lesions.csv (subject,lesion_volume_mm3,
      lesion_count; 26-connectivity components), plus LST-AI's per-region
      stats <sub>_lesionregions.csv unless SEGMENT_ONLY.
    mediaTypes: [text/csv]
